specVersion: 1.3.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: CourseMarket
    network: sepolia
    source:
      address: "0x50dff16440510f905f2735c2e9290056878922dd"
      abi: CourseMarket
      startBlock: 11491622
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Course
        - Purchase
      abis:
        - name: CourseMarket
          file: ./abis/CourseMarket.json
      eventHandlers:
        - event: CourseSubmitted(indexed uint256,indexed address,uint256,string)
          handler: handleCourseSubmitted
        - event: CourseStatusChanged(indexed uint256,uint8)
          handler: handleCourseStatusChanged
        - event: CoursePurchased(indexed uint256,indexed address,uint256,uint256)
          handler: handleCoursePurchased
      file: ./src/course-market.ts
  - kind: ethereum
    name: CourseCertificate
    network: sepolia
    source:
      address: "0xfadbd9f71428165829f27cccf624b1bab3cbaa26"
      abi: CourseCertificate
      startBlock: 11491622
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Certificate
      abis:
        - name: CourseCertificate
          file: ./abis/CourseCertificate.json
      eventHandlers:
        - event: CertificateIssued(indexed uint256,indexed uint256,indexed address,string)
          handler: handleCertificateIssued
      file: ./src/certificate.ts
